<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
</head>
<body>
    <header>
        <h1>Nordle</h1>
        <p>Don't guess the word.</p>
    </header>

    <div id="stats"></div>
    <div id="guesses"></div>

    <form id="guess-form">
        <input type="text" id="guess-input" maxlength="5" placeholder="5-letter word" autocomplete="off" spellcheck="false">
        <button type="submit">Guess</button>
    </form>

    <div id="message"></div>
    <button id="new-game-btn">New Game</button>

    <div id="keyboard"></div>

    <script type="module" src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
